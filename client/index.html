<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AMADE Software Solutions provides modern software solutions, technology training, digital services and entrepreneurship support."
    />
    <meta
      name="keywords"
      content="AMADE, software solutions, technology training, entrepreneurship, web development, digital solutions"
    />
    <script>
      (() => {
        let theme = "system";
        try {
          const storedTheme = localStorage.getItem("amade-theme");
          if (["light", "dark", "system"].includes(storedTheme)) theme = storedTheme;
        } catch {
          // The system preference remains available when browser storage is blocked.
        }
        const dark = theme === "dark"
          || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        const root = document.documentElement;
        root.dataset.theme = dark ? "dark" : "light";
        root.dataset.themePreference = theme;
        root.style.colorScheme = dark ? "dark" : "light";
        root.classList.toggle("dark", dark);
      })();
    </script>
    <title>AMADE Software Solutions | Build. Learn. Innovate. Grow.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
